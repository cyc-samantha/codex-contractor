name: harness-gate

# CX-54 — CI-Green merge gate. Runs Python and enforcement-hook tests on any PR
# that touches the enforcement surface.

# Push trigger is deliberately UNFILTERED (no `paths:`) — a path-filtered
# push would silently skip runs on main commits that touch only
# non-listed files, defeating "every push to main runs the gate". The
# job is sub-minute, so unfiltered-on-main is cheap and correct. Path
# filters stay on `pull_request` only — do not add `paths:` here.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".codex/hooks/**"
      - ".codex/rules/**"
      - ".agents/skills/**"
      - "tests/shell/**"
      - ".github/workflows/harness-gate.yml"
      - "scripts/**"
      - "pyproject.toml"
      - "justfile"
      - "requirements-dev.txt"
      - "tests/test_dispatch_contract.py"
      - "tests/test_pipeline_state.py"
      - "tests/test_task_discovery.py"
      - "tests/test_task_selection.py"
      - "tests/test_writer_claim.py"
      - "AGENTS.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          version: "0.12.0"

      - name: Install Python test tooling
        run: |
          uv venv --python 3.14
          uv pip install -r requirements-dev.txt

      - name: Validate project TOML
        run: uv run python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"

      - name: Run Python test suite
        run: .venv/bin/python -m pytest tests

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats, jq, and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats jq shellcheck

      - name: Verify hooks.json is valid JSON
        run: jq -e . .codex/hooks/hooks.json > /dev/null

      - name: Lint shell sources
        run: shellcheck --severity=error .codex/hooks/*.sh .codex/hooks/_lib/*.sh scripts/*.sh

      - name: Run enforcement-hook test suite
        run: bats tests/shell/
